project:
  name: "ReadmitIQ"
  random_seed: 42

paths:
  raw_data: "data/raw/diabetic_data.csv"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  metrics_dir: "reports/metrics"
  figures_dir: "reports/figures"

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  n_splits: 10

rag:
  model_name: "all-MiniLM-L6-v2"
  embedding_dim: 384
  k_neighbors: 20
  k_search: 50
  oof_splits: 5
  batch_size: 128

models:
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    solver: "lbfgs"
  random_forest:
    n_estimators: 150
    max_depth: 12
    min_samples_split: 10
    class_weight: "balanced"
    n_jobs: -1
  lightgbm:
    n_estimators: 150
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 7.7
    random_state: 42
    n_jobs: -1
  transformer:
    model_name: "distilbert-base-uncased"
    max_length: 128
    batch_size: 32
    epochs: 2
    learning_rate: 0.00003
    sample_size_cpu: 2500

evaluation:
  top_k_percent: 0.10
  n_bootstraps: 1000
