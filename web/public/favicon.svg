<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#101B2D"/>
  <!-- Cardiac ECG waveform morphing into letterforms I and Q -->
  <path d="M3 16h4l2-6 3 13 2.5-9 1.5 2h3" stroke="#0B7A75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Letter I -->
  <path d="M21 10v12" stroke="#F5F1E8" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Letter Q with oval and tail -->
  <circle cx="27" cy="15" r="3.5" stroke="#F5F1E8" stroke-width="1.8"/>
  <path d="M28.5 17.5l2 2" stroke="#D9472B" stroke-width="2" stroke-linecap="round"/>
</svg>