name: ReadmitIQ CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  python-test-and-lint:
    name: Python Lint, Tests & Smoke Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Code Formatting & Lint Check
        run: |
          black --check src/ api/ tests/ scripts/
          ruff check src/ api/ tests/ scripts/

      - name: Verify / Generate CI Fixtures
        run: |
          python scripts/generate_ci_fixtures.py

      - name: Run Test Suite (Fixture Fallback & Skip Guards)
        run: |
          pytest tests/ -v

      - name: API Smoke Test (Background Uvicorn in Lite Mode)
        run: |
          export READMITIQ_SERVE_MODE=lite
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          python scripts/smoke_test.py --base-url http://127.0.0.1:8000

  frontend-build-and-lint:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint Frontend
        working-directory: ./web
        run: npm run lint

      - name: Build Frontend
        working-directory: ./web
        run: npm run build

  docker-build-verification:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: |
          docker build -t readmitiq-api:ci .

      - name: Build Web Docker Image
        run: |
          docker build -t readmitiq-web:ci ./web
